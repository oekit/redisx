name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Test
    uses: oekit/.github/.github/workflows/go-ci.yml@main
    with:
      # go-version 必须与 go.mod 的 go 指令**成对**（否则最低支持版本从未被验证过）：
      # go.mod 已随依赖上移到 1.26（go-redis v9.23.0 / x/time v0.16.0 / x/sys v0.48.0 均要求 go>=1.26），
      # CI 必须同步跟到 1.26，否则 setup-go 的 1.24 工具链（GOTOOLCHAIN=local）会直接报
      # "go.mod requires go >= 1.26.0"。口径见 matrix-tools（业务层 1.24/1.25/1.26 均可）。
      go-version: '1.26'
